[package]
name = "varde"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
gio = { version = "0.21", features = ["v2_80"] }
gdk-pixbuf = "0.21"
gtk = { package = "gtk4", version = "=0.10.3", features = ["v4_12"] }
gtk4-layer-shell = "=0.7.0"
libc = "0.2"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
